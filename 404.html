<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>selenophile — bakımda</title>
<meta name="description" content="selenophile şu an bakımda.">
<meta name="theme-color" content="#f4f2ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141412" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;800&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f2ec;--fg:#161513;--soft:#6b665d;--rule:#d9d5ca;--red:#c23318;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#141412;--fg:#ecebe6;--soft:#9a958b;--rule:#2e2c28;--red:#e0553b}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:400 17px/1.55 "Schibsted Grotesk",system-ui,sans-serif;display:grid;place-items:center;padding:24px 16px;-webkit-font-smoothing:antialiased}
main{width:100%;max-width:440px}
.mark{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;letter-spacing:-.01em;padding-bottom:14px;border-bottom:1px solid var(--rule)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--red)}
h1{font-weight:800;font-size:clamp(34px,8vw,48px);line-height:1.05;letter-spacing:-.03em;margin:44px 0 16px}
p{color:var(--soft);font-weight:400}
.foot{margin-top:44px;padding-top:14px;border-top:1px solid var(--rule);font-size:13px;color:var(--soft);font-weight:500}
</style>
</head>
<body>
<main>
  <div class="mark"><span class="dot" aria-hidden="true"></span>selenophile</div>
  <h1>Bakımdayız.</h1>
  <p>Site kısa bir süreliğine kapalı. Yakında geri döneceğiz.</p>
  <div class="foot">selenophile.art</div>
</main>
</body>
</html>
